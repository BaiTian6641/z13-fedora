---
# Waydroid ships in Fedora proper (1.6.3-2 for F43/44/45) with a SELinux subpackage. No kernel
# work is needed: Fedora's kernel has
#     CONFIG_ANDROID_BINDER_IPC=y, CONFIG_ANDROID_BINDERFS=y,
#     CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
# and the RPM ships dev-binderfs.mount plus a patched waydroid-container.service.
#
# The Android images (official channel: LineageOS 20 / Android 13 GAPPS - the one Waydroid 1.6.x
# is developed against; the Android TV project's a16-qpr2 builds crash-looped on this device and
# are a TV form factor anyway) are BAKED into the image, into upstream's preinstalled-images path
# /usr/share/waydroid-extra/images (tools/config/__init__.py: preinstalled_images_paths).
# On first boot z13-waydroid-init.service runs `waydroid init`, which detects the preinstalled
# images (tools/actions/initializer.py), writes waydroid.cfg with OTA=None, applies the Z13
# props and enables the container service - no download, no user interaction.
#
# Track A renders on the Intel iGPU (Waydroid's gpu.py skips NVIDIA render nodes by design).
# See recipes/waydroid-dgpu.yml (to be added at milestone M4B) for the experimental dGPU stack.
modules:
  - type: dnf
    install:
      packages:
        - waydroid
        - waydroid-selinux

  - type: script
    snippets:
      - |
        set -euo pipefail
        # Bake the Android images. Manifests per upstream initializer.py URL composition:
        #   system: <channel>/<rom>/waydroid_<arch>/<system_type>.json
        #   vendor: <channel>/waydroid_<arch>/<vendor_type>.json      (MAINLINE on bare x86_64)
        # sha256 is verified against the manifest's "id" before anything lands in the image.
        mkdir -p /usr/share/waydroid-extra/images
        python3 - <<'BAKE'
        import hashlib, json, os, sys, urllib.request, zipfile

        DEST = "/usr/share/waydroid-extra/images"
        MANIFESTS = [
            ("https://ota.waydro.id/system/lineage/waydroid_x86_64/GAPPS.json", "system.img"),
            ("https://ota.waydro.id/vendor/waydroid_x86_64/MAINLINE.json", "vendor.img"),
        ]
        UA = {"User-Agent": "bluebuild-z13/1.0"}
        for url, imgname in MANIFESTS:
            with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                m = json.load(r)["response"][0]
            zippath = "/tmp/" + m["filename"]
            print(f"-> {m['filename']} ({m['size']/1e9:.2f} GB, version {m['version']}, ASB {m.get('asb','?')})", flush=True)
            with urllib.request.urlopen(urllib.request.Request(m["url"], headers=UA), timeout=600) as r, open(zippath, "wb") as f:
                for chunk in iter(lambda: r.read(1 << 24), b""):
                    f.write(chunk)
            h = hashlib.sha256()
            with open(zippath, "rb") as f:
                for chunk in iter(lambda: f.read(1 << 24), b""):
                    h.update(chunk)
            if h.hexdigest() != m["id"]:
                sys.exit(f"sha256 mismatch for {m['filename']}: {h.hexdigest()} != {m['id']}")
            with zipfile.ZipFile(zippath) as z:
                src = imgname if imgname in z.namelist() else z.namelist()[0]
                with z.open(src) as f, open(os.path.join(DEST, imgname), "wb") as out:
                    for chunk in iter(lambda: f.read(1 << 24), b""):
                        out.write(chunk)
            os.remove(zippath)
            print(f"   baked {imgname} (sha256 verified)", flush=True)
        BAKE
        ls -lh /usr/share/waydroid-extra/images/

  - type: systemd
    system:
      enabled:
        # Runs once at first boot (ConditionPathExists=!/var/lib/waydroid/waydroid.cfg).
        - z13-waydroid-init.service
