---
# Root filesystem overlay. Everything under files/system/ is copied verbatim into the image root
# (mirrored paths), so files/system/usr/libexec/z13/x.sh lands at /usr/libexec/z13/x.sh.
#
# Note: the files module must NOT write into directories that ostree later symlinks into /var
# (/home, /opt, /srv, /root, /usr/local, /mnt, /tmp).
modules:
  - type: files
    files:
      - source: system
        destination: /

  # The `files` module copies with a plain `cp -rf`, so the mode the scripts end up with depends on
  # the build's umask (checked: umask 022 preserves the 0755 they carry in git). Assert the invariant
  # rather than inherit it: `ujust` execs these scripts directly, and on an immutable image a wrong
  # mode cannot be repaired after installation - it would need another image build.
  - type: script
    snippets:
      - "chmod 0755 /usr/libexec/z13/*.sh"

  # ujust only sees recipes the ublue-os-just package wired into /usr/share/ublue-os/justfile at
  # package-build time (explicit `import` lines + an optional 60-custom.just). Dropping
  # 99-z13.just into the just/ directory is NOT enough - it must be imported explicitly, or every
  # `ujust z13-*` call fails with 'justfile does not contain recipe'. Also gate on syntax: a
  # broken justfile in an immutable image cannot be repaired without another build.
  - type: script
    snippets:
      - |
        set -euo pipefail
        just --justfile /usr/share/ublue-os/just/99-z13.just --list >/dev/null
        JUSTFILE=/usr/share/ublue-os/justfile
        touch "$JUSTFILE"
        grep -q '99-z13.just' "$JUSTFILE" || echo 'import "/usr/share/ublue-os/just/99-z13.just"' >> "$JUSTFILE"
        just --justfile "$JUSTFILE" --list >/dev/null
