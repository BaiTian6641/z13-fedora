---
# KDE Plasma desktop layer for a touch/pen tablet.
#
# Power stack: Fedora 44 uses tuned/tuned-ppd as the power-profiles-daemon provider
# (Fedora 41 change) — installing power-profiles-daemon alongside it conflicts. asusd also writes
# platform_profile/EPP, so usr/libexec/z13/oobe.sh disables that coupling in /etc/asusd/asusd.ron
# to keep one writer in charge.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        # on-screen keyboard: plasma-keyboard is the Plasma 6.6+ OSK; maliit is the fallback if
        # the 6.7 regressions (KDE bug 522675) bite on this image
        - plasma-keyboard
        - maliit-keyboard
        # hardware bring-up and daily tooling (user-reported gaps, 2026-09-17 session)
        - btop                              # interactive process/resource monitor
        - ksystemlog                        # kernel + service log viewer (GUI)
        - brightnessctl                     # keyboard backlight: /sys/class/leds/asus::kbd_backlight
        - wireguard-tools                   # wg client plumbing under NetworkManager
        - tailscale                         # optional mesh VPN: 'systemctl enable --now tailscaled'
        - zerotier-one                      # optional mesh VPN: 'systemctl enable --now zerotier-one'
        # metric-compatible fonts so documents from Windows users keep their layout in ONLYOFFICE
        - google-carlito-fonts            # Calibri metrics
        - google-crosextra-caladea-fonts  # Cambria metrics
        - google-arimo-fonts              # Arial metrics
        - liberation-sans-fonts            # Arial metrics
        - liberation-serif-fonts           # Times metrics
        # NB: there is no "liberation-fonts" binary package in Fedora 44 (verified) — only the
        # per-style subpackages above.
        - tuned
        - tuned-ppd
  - type: systemd
    system:
      # At build time these units exist because the packages above (and asusctl) are installed first.
      # Unit names verified against the packaging: tuned-ppd.service (Fedora tuned spec),
      # asusd.service (asusctl Makefile: BIN_D := asusd), waydroid-container.service (Fedora waydroid spec).
      enabled:
        - tuned-ppd.service
        - asusd.service
      disabled:
        # Waydroid is started on demand (ujust z13-waydroid-setup), not at every boot.
        - waydroid-container.service
        # Optional mesh VPNs ship enabled-by-default in their RPMs; leave them OFF until chosen.
        # Enable with: systemctl enable --now tailscaled   /   zerotier-one
        - tailscaled.service
        - zerotier-one.service
      # NOTE: asusd-user.service is a *user* unit whose unit file upstream does not reliably install
      # (the Makefile installs the binary but has no rule for the .service), so it is enabled at
      # runtime by z13-oobe only if present — never at build time, where a missing unit fails the build.
