---
# Applications. The system Flatpaks are BAKED into the image at build time - but NOT in
# /var/lib/flatpak: BlueBuild's universal post_build.sh ends every build with `rm -rf /var/*`,
# which silently wiped the first attempt (confirmed via whiteout entries var/.wh.lib etc. in the
# final image layer). They are staged at /usr/share/z13/flatpak (a complete flatpak system-dir
# via FLATPAK_SYSTEM_DIR: repo + deployed apps + exports + flathub remote config), and
# z13-apps-ensure.service materializes the tree into /var/lib/flatpak at first boot
# (cp -a --reflink=auto + restorecon) - origins stay 'flathub', so updates work normally.
# default-flatpaks stays as a silent network fallback.
modules:
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Root in the build container installs directly (no system-helper / dbus needed).
        # FLATPAK_SYSTEM_DIR redirects the system installation to a staging path under /usr,
        # because post_build.sh wipes /var at the end of every BlueBuild image build.
        # com.visualstudio.code is deliberately NOT baked: it is an extra-data flatpak whose
        # apply_extra script runs in a bubblewrap sandbox, and unprivileged build containers
        # cannot create user namespaces (bwrap: Operation not permitted). The first-boot
        # fallback service below installs it on the real machine, where bwrap works.
        export FLATPAK_SYSTEM_DIR=/usr/share/z13/flatpak
        mkdir -p "$FLATPAK_SYSTEM_DIR"
        flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install -y --system --noninteractive flathub \
          org.onlyoffice.desktopeditors \
          com.valvesoftware.Steam \
          com.vysp3r.ProtonPlus \
          org.videolan.VLC \
          org.chromium.Chromium \
          org.kde.krita \
          com.github.flxzt.rnote \
          com.github.xournalpp.xournalpp \
          org.gnome.Loupe
        flatpak list --system --app --columns=application,version

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          # Installs only what is missing; on devices from the new ISO that is just VS Code
          # (extra-data, cannot be baked - see the script module above).
          - com.visualstudio.code           # VS Code (user-requested)
          - org.onlyoffice.desktopeditors   # 9.4.0
          - com.valvesoftware.Steam          # gaming: Steam client (flatpak keeps the runtime out of the image)
          - com.vysp3r.ProtonPlus            # gaming: Proton-GE / compatibility-tool manager
          - org.videolan.VLC                 # media player for the odd codec KDE's stack lacks
          - org.chromium.Chromium           # second browser for Android-ecosystem webviews
          - org.kde.krita                   # stylus drawing
          - com.github.flxzt.rnote          # pen/ink notes
          - com.github.xournalpp.xournalpp  # pen/ink notes + PDF annotation
          - org.gnome.Loupe                 # image viewer (KDE ships Gwenview too)
      - scope: user                         # Flathub remote available to the user as well

  # Converge the app set on the device: restorecon fixes build-time labels on baked content
  # (container_file_t makes flatpak unable to read its own repo), missing apps are reinstalled.
  - type: systemd
    system:
      enabled:
        - z13-apps-ensure.service
