---
# NVIDIA userspace + kernel modules from Universal Blue's prebuilt akmods streams
# (ghcr.io/ublue-os/akmods:main-44 and ghcr.io/ublue-os/akmods-nvidia-open:main-44).
#
# The module also writes the kernel arguments itself, into
# /usr/lib/bootc/kargs.d/00-bluebuild-nvidia-kargs.toml:
#   rd.driver.blacklist=nouveau, modprobe.blacklist=nouveau, nvidia-drm.modeset=1,
#   initcall_blacklist=simpledrm_platform_driver_init
#
# Why nvidia-open: GA107 (RTX 3050 Laptop) is supported by the open kernel modules, and the open
# module is REQUIRED by the optional dGPU Waydroid stack (the closed module has no DMA-BUF support).
modules:
  # Multilib skew guard: the akmods module pulls 32-bit (i686) mesa for NVIDIA/Steam, and rpm
  # requires identical NVRs across arches. When Fedora's repos publish a new mesa ahead of the
  # base image, the i686 install conflicts with the installed x86_64 build and the transaction
  # fails (seen 2026-09-19: i686 26.2.3 vs base 26.2.2). Align mesa to repo-latest first.
  - type: script
    snippets:
      - |
        set -euo pipefail
        dnf5 upgrade -y --refresh 'mesa*' || dnf5 upgrade -y --refresh mesa-dri-drivers mesa-vulkan-drivers
  - type: akmods
    base: main
    # No extra ublue kmods are needed on this device; the key is required by the module schema.
    install: []
    nvidia-driver: nvidia-open
