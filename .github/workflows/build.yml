name: bluebuild

on:
  schedule:
    - cron: "00 06 * * *" # 06:00 UTC daily, after Universal Blue's own nightly builds
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      validate_without_signing:
        description: "Also run the unsigned validation build (~20 minutes of runner time)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Signing is mandatory for a published image (the CLI refuses to push without the key pair), and
  # the private key only exists as the SIGNING_SECRET repository secret. Until that secret is set,
  # this gate sends the run to `validate` instead: the same recipe, built end-to-end but neither
  # signed nor pushed, which still exercises every module (rpm, akmods, waydroid, flatpaks,
  # systemd, files) and reports real build errors.
  #
  # The unsigned path is supported by design - in the CLI the signing requirements sit behind
  # `if self.push && !self.no_sign` (src/commands/build.rs), and the recipe's `signing` module
  # needs only the committed cosign.pub, which the generated `stage-keys` stage copies into the
  # image (template/templates/stages.j2) - so the recipe itself needs no modification.
  detect:
    name: Check whether the signing secret exists
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.detect.outputs.has_key }}
    steps:
      - name: Detect SIGNING_SECRET
        id: detect
        shell: bash
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [[ -n "${SIGNING_SECRET}" ]]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "SIGNING_SECRET is configured: this run publishes and signs the image."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING_SECRET is not configured: this run validates the recipe with an unsigned build instead of publishing."
          fi

  publish:
    name: Build and publish the image
    needs: detect
    if: needs.detect.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a hung NVIDIA/kmods build should not burn six runner hours
    permissions:
      contents: write # only for committing the failure log to .ci/
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
          # Track B (experimental dGPU-Waydroid variant) is added at milestone M4B - it needs the
          # dGPU-Waydroid stage build, and it is only worth building once `ujust z13-mux` has shown
          # that the compositor can actually be moved onto the NVIDIA GPU on this machine.
          # - recipe-dgpu.yml
    steps:
      # The recipe, cosign.pub and the scripts all come from the checkout; everything below runs
      # outside any action, so this is not optional.
      - uses: actions/checkout@v4

      # Non-optional in the same way: the build holds the base image, the built image, the staging
      # push of the unchunked image and chunkah's work simultaneously - roughly 3x the image size.
      # The captured failure log from 44f10c1 shows the process dying silently mid-push with no error
      # message, which is what disk exhaustion looks like; dropping this step when the action was
      # replaced was a regression (the validation job kept it, which is why it never failed).
      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"

      - name: Compute lowercase registry namespace
        id: ns
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read the image name from the recipe
        id: img
        shell: bash
        run: |
          set -euo pipefail
          name=$(awk '/^name:/{print $2; exit}' "recipes/${{ matrix.recipe }}")
          [ -n "${name}" ] || { echo "::error::no name: in recipes/${{ matrix.recipe }}"; exit 1; }
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Fails in seconds, with the cause in the step name, if the secret and cosign.pub are not a
      # pair - instead of failing twenty minutes into a build.
      - name: Check that SIGNING_SECRET matches the committed cosign.pub
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if ! command -v cosign >/dev/null; then
            curl -sSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi
          printf '%s' "${COSIGN_PRIVATE_KEY}" > /tmp/signing.key
          derived=$(COSIGN_PASSWORD="" cosign public-key --key /tmp/signing.key)
          rm -f /tmp/signing.key
          if ! diff <(printf '%s' "${derived}" | tr -d '[:space:]') <(tr -d '[:space:]' < cosign.pub) >/dev/null; then
            echo "::error::SIGNING_SECRET does not match the committed cosign.pub - they must be a pair"
            exit 1
          fi
          echo "SIGNING_SECRET matches cosign.pub"

      - name: Install the BlueBuild CLI
        run: |
          set -euo pipefail
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/local/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version

      # GitHub runs bash with -e, so this step handles its own failure: the log is committed to
      # .ci/last-failure.md from *this* step (a dedicated capture step died silently three times,
      # because one unguarded command was enough to kill it), and an artifact always carries the
      # full log.
      - name: Build, sign and publish the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          GH_TOKEN: ${{ github.token }}
          BB_BUILD_PUSH: "true"
          BB_BUILD_CHUNKED_OCI: "true"
          BB_BUILD_CHUNKED_OCI_MAX_LAYERS: "120"
          BB_BUILD_REMOVE_BASE_IMAGE: "true"
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ steps.ns.outputs.owner }}
          BB_USERNAME: ${{ github.repository_owner }}
          BB_PASSWORD: ${{ github.token }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -uo pipefail
          rc=0
          bluebuild build -v "recipes/${{ matrix.recipe }}" 2>&1 | tee /tmp/build.log || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "build and publish succeeded"
            exit 0
          fi
          echo "build failed with rc=${rc}; committing the log to .ci/last-failure.md"
          {
            echo "# Last publish failure"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo '```'
            tail -c 60000 /tmp/build.log 2>/dev/null | tail -120 || echo "(no build log captured)"
            echo '```'
          } > /tmp/ci-body || true
          rm -rf /tmp/ci-repo
          if git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ci-repo 2>/tmp/clone.err; then
            mkdir -p /tmp/ci-repo/.ci
            cp /tmp/ci-body /tmp/ci-repo/.ci/last-failure.md || true
            if (cd /tmp/ci-repo \
                && git add .ci/last-failure.md \
                && git -c user.name="github-actions[bot]" \
                      -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                      commit -q -m "ci: record the last failure log [skip ci]" \
                && git push -q origin HEAD:main); then
              echo "failure log committed to .ci/last-failure.md"
            else
              echo "clone ok but commit/push failed"
            fi
          else
            echo "clone failed: $(head -c 300 /tmp/clone.err 2>/dev/null)"
          fi
          exit "${rc}"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-build-log
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 7

      # The substance of criteria 2 and 3, visible in the public job list even while the package is
      # private: the signature validates against the committed key on both tags, and the layer count
      # is within what the installer step can pull.
      - name: Re-verify the published image against cosign.pub
        env:
          OWNER: ${{ steps.ns.outputs.owner }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          set -euo pipefail
          for tag in 44 latest; do
            cosign verify --key cosign.pub "ghcr.io/${OWNER}/${IMAGE}:${tag}"
          done

      - name: Check the published layer count
        env:
          OWNER: ${{ steps.ns.outputs.owner }}
          IMAGE: ${{ steps.img.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GH_TOKEN}"
          ref="docker://ghcr.io/${OWNER}/${IMAGE}:latest"
          idx=$(skopeo inspect --raw "${ref}")
          digest=$(jq -r '(.manifests // [])[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' <<< "${idx}" | head -1)
          if [[ -n "${digest}" && "${digest}" != "null" ]]; then
            layers=$(skopeo inspect --raw "docker://ghcr.io/${OWNER}/${IMAGE}@${digest}" | jq '.layers | length')
          else
            layers=$(jq '.layers | length' <<< "${idx}")
          fi
          echo "published layers: ${layers}"
          if [ "${layers}" -gt 500 ]; then
            echo "::error::${layers} layers crosses containers-storage's hard limit of 500"
            exit 1
          fi
          if [ "${layers}" -gt 128 ]; then
            echo "::warning::${layers} layers is above Docker's recommended ceiling of 128 (harmless for the ISO step, which uses podman/skopeo)"
          fi

      - name: Report whether the package is anonymously pullable
        env:
          OWNER: ${{ steps.ns.outputs.owner }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          set -euo pipefail
          tok=$(curl -s "https://ghcr.io/token?scope=repository:${OWNER}/${IMAGE}:pull&service=ghcr.io" | jq -r '.token // empty')
          if [ -z "${tok}" ]; then
            echo "::warning::ghcr.io/${OWNER}/${IMAGE} is not anonymously pullable. The publish succeeded, but the ISO step cannot fetch a private package - set *Settings -> Packages -> ${IMAGE} -> Change visibility* to Public."
          else
            echo "publicly pullable: the ISO step can fetch ghcr.io/${OWNER}/${IMAGE}"
          fi

  validate:
    name: Validate recipe (build only, publishes nothing)
    needs: detect
    # Costs ~20 minutes of runner time, so it is opt-in: the recipe is validated locally
    # (bluebuild validate + actionlint/shellcheck), and once the secret is set the publish build
    # exercises it for real. A manual run with no secret and this input untouched therefore costs
    # seconds, which is also the cheapest way to check whether SIGNING_SECRET is visible yet.
    if: needs.detect.outputs.has_key != 'true' && inputs.validate_without_signing == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # only for committing the failure log to .ci/
      packages: read
    steps:
      # The official action performs this itself (action.yml runs actions/checkout unless
      # skip_checkout is set) - without it the CLI finds no recipe and the runner has no git repo.
      - uses: actions/checkout@v4

      # GHCR rejects mixed-case namespaces; GitHub usernames are case-preserving.
      - name: Compute lowercase registry namespace
        id: ns
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"

      # The official action runs the CLI as one opaque step, and its log is only reachable through
      # an authenticated API call - which makes a red build undiagnosable from the outside. Running
      # the CLI directly costs a few lines and produces a build log that is uploaded as an artifact.
      - name: Install the BlueBuild CLI
        run: |
          set -euo pipefail
          # Pinned to the same tag the publishing action defaults to (its CLI_VERSION_TAG
          # is `v0.9`), so a floating `latest` cannot silently diverge from what publishes.
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/local/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version

      # The official action brings its own runtime setup; a hand-rolled invocation has to do it.
      # ubuntu-latest does not ship podman (the ISO job installs it for the same reason), and the
      # CLI refuses to start without docker>=23, podman>=4 or buildah>=1.29.
      - name: Install podman
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Build the image without pushing it
        env:
          # Same flags the publishing job passes through the action.
          BB_BUILD_PUSH: "false"
          BB_BUILD_CHUNKED_OCI: "true"
          BB_BUILD_CHUNKED_OCI_MAX_LAYERS: "120"
          BB_BUILD_REMOVE_BASE_IMAGE: "true"
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ steps.ns.outputs.owner }}
          GH_TOKEN: ${{ github.token }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -o pipefail
          bluebuild build -v recipes/recipe.yml 2>&1 | tee /tmp/build.log
          echo "build finished with status ${PIPESTATUS[0]}"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-build-log
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 7

      # Workflow logs and artifacts both need an authenticated API call to read, which makes a red
      # validation undiagnosable for anyone without a token. On failure the tail of the log is
      # therefore committed to .ci/last-failure.md, which is readable with a plain `git pull`.
      # Remove this step once the pipeline is green end to end.
      - name: Record the failure log in the repository
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-body
          {
            echo "# Last validation build failure"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -c 40000 /tmp/build.log 2>/dev/null || echo "(no build log was produced)"
            echo '```'
          } > /tmp/ci-body
          # Commit through the API rather than git: the workspace here is the action's checkout, where
          # `git checkout -B main` can fail on local modifications - which is how the previous two
          # failures lost their logs. gh is preinstalled on GitHub-hosted runners.
          # Fresh clone rather than the current workspace: this step runs after the build, where the
          # working tree may be dirty and a plain `git checkout -B main` aborts (that is how the first
          # attempts lost their logs). A clean clone has nothing to conflict with.
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ci-repo
          mkdir -p /tmp/ci-repo/.ci
          cp /tmp/ci-body /tmp/ci-repo/.ci/last-failure.md
          cd /tmp/ci-repo
          # `git commit -am` would not stage the new file: .ci/last-failure.md is always untracked.
          git add .ci/last-failure.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "ci: record the last failure log [skip ci]" || true
          git push -q origin HEAD:main || echo "could not push the failure log"
