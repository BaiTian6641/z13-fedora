name: iso

# Builds an offline installer ISO from an already-published image.
# The ISO embeds the image as an OCI payload (JasonN3/build-container-installer → Anaconda
# `ostreecontainer`), so installation needs no network. Write it to a >=16 GB USB stick with
# Fedora Media Writer or `dd` — the file is ~6 GiB, well past the 4 GiB FAT32 limit.
#
# Requires the image to be built and pushed by .github/workflows/build.yml first.

on:
  # Build an installer automatically after every successful image build, so a fresh ISO exists
  # without anyone clicking anything (the guard on the job skips failed image builds).
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: Image repository name to build an installer for
        type: choice
        options:
          - z13-fedora
          - z13-fedora-dgpu
        default: z13-fedora
      tag:
        description: Image tag
        type: string
        default: latest
  release:
    types: [published]

permissions:
  contents: write # attaching assets to a release
  packages: read
  actions: read # the preflight job reads the triggering run's job list

concurrency:
  # Never run two ISO builds at once (they are heavy and share the artifact name space).
  group: iso-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # A `bluebuild` run can conclude successfully while publishing nothing: while SIGNING_SECRET is
  # unset, build.yml routes the run to its unsigned `validate` job, and there is no image in the
  # registry to embed in an ISO. So check the triggering run's jobs for a successful publish job
  # before spending 20 minutes generating an installer. Fails closed: an unreadable answer, a
  # renamed job, or a skipped publish all mean "no ISO" rather than a doomed ISO build.
  preflight:
    name: Check that an image was published
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check that the image is published and pullable
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Expressions live in env, never in the run body: actionlint's embedded shellcheck sees
          # the substituted script, and constructs around the placeholder get misjudged (SC2317
          # called the whole decision flow unreachable; the real trigger was the placeholder).
          IMAGE: ${{ inputs.image || 'z13-fedora' }}
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${IMAGE:?}"
          tag="${TAG:?}"

          # The triggering run's job list is only a proxy for "is there an image to embed". Test the
          # premise directly: can this tag be pulled anonymously? That is also exactly what the
          # builder container does (generate-iso mounts no credentials), so it folds in the visibility
          # check - a private package yields no ISO.
          # Single decision flow, no early exits: actionlint's embedded shellcheck treats code after
          # a top-level-looking exit as unreachable (SC2317), which fails the lint job.
          published=false
          tok=$(curl -s "https://ghcr.io/token?scope=repository:${owner}/${image}:pull&service=ghcr.io" \
                  | jq -r '.token // empty')
          if [[ -z "${tok}" ]]; then
            echo "ghcr.io/${owner}/${image}:${tag} is not anonymously pullable - either nothing has been published yet, or the package is private. If the publish succeeded, set *Settings -> Packages -> ${image} -> Change visibility* to Public and re-run this workflow."
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer ${tok}" \
                     -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
                     "https://ghcr.io/v2/${owner}/${image}/manifests/${tag}")
            if [[ "${code}" == "200" ]]; then
              published=true
              echo "ghcr.io/${owner}/${image}:${tag} resolves and is anonymously pullable; proceeding"
            else
              echo "ghcr.io/${owner}/${image}:${tag} is pullable but the tag does not resolve (HTTP ${code})"
            fi
          fi
          echo "published=${published}" >> "$GITHUB_OUTPUT"

  iso:
    name: Build installer ISO
    needs: preflight
    # Skip when the triggering image build failed, when it published nothing (see preflight), and
    # skip pull-request builds (no ISO for those); manual and release dispatches always run.
    if: >-
      ${{ needs.preflight.outputs.published == 'true'
          && (github.event_name != 'workflow_run'
              || (github.event.workflow_run.conclusion == 'success'
                  && github.event.workflow_run.event != 'pull_request')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90 # a stuck ISO build must not burn six runner hours
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"

      - name: Install podman (used by the ISO builder)
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Log in to GHCR (only needed while the image package is private)
        run: |
          set -uo pipefail
          TOKEN="${{ github.token }}"
          ACTOR="${{ github.actor }}"
          echo "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin || true
          if command -v podman >/dev/null; then
            echo "${TOKEN}" | podman login ghcr.io -u "${ACTOR}" --password-stdin || true
          fi
          # The ISO step below runs the builder under sudo, so it works as root - with root's own
          # auth files, which the logins above do not touch.
          echo "${TOKEN}" | sudo docker login ghcr.io -u "${ACTOR}" --password-stdin || true
          if command -v podman >/dev/null; then
            echo "${TOKEN}" | sudo podman login ghcr.io -u "${ACTOR}" --password-stdin || true
          fi

      - name: Verify the image signature
        if: ${{ hashFiles('cosign.pub') != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          install-dir: /usr/bin
          use-sudo: true

      - name: Verify signature (cosign)
        if: ${{ hashFiles('cosign.pub') != '' }}
        env:
          IMAGE: ${{ inputs.image || 'z13-fedora' }}
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cosign verify --key cosign.pub "ghcr.io/${OWNER}/${IMAGE}:${TAG}"

      # `bluebuild generate-iso` cannot work here: the CLI pins build-container-installer v1.4.0
      # (utils/src/constants.rs, unchanged on main), and BCI only gained Fedora 44 support in v1.5.0
      # ("Upgrade to fedora 44", PR #196, 2026-05-03) - which is why both ISO attempts died after
      # pulling. This mirrors the CLI's own invocation (src/commands/generate_iso.rs) against v1.5.0;
      # v1.5.0 also carries the >128-layer fix. Revert to `bluebuild generate-iso` if the CLI moves.
      - name: Build ISO (BCI v1.5.0, pinned directly)
        env:
          IMAGE: ${{ inputs.image || 'z13-fedora' }}
          TAG: ${{ inputs.tag || 'latest' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${HEAD_SHA:-manual}"
          ISO_NAME="${IMAGE}-${TAG}-$(date -u +%Y%m%d)-${SHA:0:7}.iso"
          # if/then, not ampersand-guard: with set -e a false test-and-assign line exits the
          # script, and actionlint's shellcheck then reads everything below as unreachable.
          if [[ "${ISO_NAME}" == *"-.iso" ]]; then
            ISO_NAME="${IMAGE}-${TAG}-$(date -u +%Y%m%d)-manual.iso"
          fi
          VERSION=$(awk '/^image-version:/{print $2; exit}' recipes/recipe.yml)
          [ -n "${VERSION}" ] || { echo "::error::no image-version in recipes/recipe.yml"; exit 1; }
          echo "building ${ISO_NAME} for Fedora ${VERSION} from ghcr.io/${OWNER}/${IMAGE}:${TAG}"

          mkdir -p iso-out
          # VARIANT=kinoite is what makes Anaconda ask for the user account during installation
          # (as KDE requires) rather than at first boot. Tee so a failure leaves something readable:
          # the runner's log needs an authenticated API call, this container's output does not exist
          # anywhere else.
          # bash runs with -e by default; this step handles its own failure so the builder's log
          # survives. The invocation mirrors build-container-installer's own action.yml exactly:
          # the make target comes first, the workspace is mounted at /github/workspace, ISO_NAME is
          # an absolute path inside it, /cache is pre-created 0777, and docker (not podman) runs it.
          set -uo pipefail
          sudo mkdir -p /cache/dnf /cache/dnf_new
          sudo chmod 777 /cache /cache/dnf /cache/dnf_new
          mkdir -p build
          rc=0
          docker run --privileged \
            -v "${PWD}:/github/workspace" \
            -v /cache/dnf:/cache/dnf \
            ghcr.io/jasonn3/build-container-installer:v1.5.0 \
            "/github/workspace/${ISO_NAME}-CHECKSUM" \
            ADDITIONAL_TEMPLATES="/github/workspace/files/lorax_templates/z13-layout.tmpl" \
            ARCH="x86_64" \
            DNF_CACHE="/cache/dnf" \
            ENROLLMENT_PASSWORD="universalblue" \
            EXTRA_BOOT_PARAMS="" \
            FLATPAK_REMOTE_NAME="flathub" \
            FLATPAK_REMOTE_URL="https://flathub.org/repo/flathub.flatpakrepo" \
            IMAGE_NAME="${IMAGE}" \
            IMAGE_REPO="ghcr.io/${OWNER}" \
            IMAGE_SIGNED="true" \
            IMAGE_SRC="" \
            IMAGE_TAG="${TAG}" \
            ISO_NAME="/github/workspace/${ISO_NAME}" \
            SECURE_BOOT_KEY_URL="https://github.com/ublue-os/bazzite/raw/main/secure_boot.der" \
            VARIANT="kinoite" \
            VERSION="${VERSION}" \
            WEB_UI="false" 2>&1 | tee /tmp/iso.log || rc=$?
          # The Makefile's $(ISO_NAME)-CHECKSUM rule writes the checksum alongside the ISO, so both
          # land in the workspace root where the artifact upload's globs expect them.
          if [ "${rc}" -eq 0 ] && [ -f "${ISO_NAME}" ]; then
            ls -lh "${ISO_NAME}"
            cat "${ISO_NAME}-CHECKSUM"
            # Surface the artefact in the run summary: the artifact itself needs a (free) GitHub
            # login, and the detail anyone actually wants is the name, size and hash.
            {
              echo "## Installer ISO"
              echo
              echo "| file | size |"
              echo "|---|---|"
              echo "| \`${ISO_NAME}\` | $(du -h "${ISO_NAME}" | cut -f1) |"
              echo
              echo '```'
              cat "${ISO_NAME}-CHECKSUM"
              echo '```'
              echo
              echo "Built from \`ghcr.io/${OWNER}/${IMAGE}:${TAG}\` (Fedora ${VERSION})."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "${rc}" -eq 0 ] && rc=1   # builder reported success but produced no ISO
          echo "ISO build failed with rc=${rc}; committing the log to .ci/last-failure.md"
          {
            echo "# Last ISO failure"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo '```'
            tail -c 200000 /tmp/iso.log 2>/dev/null | tail -400 || echo "(no builder output captured)"
            echo '```'
          } > /tmp/ci-body || true
          rm -rf /tmp/ci-repo
          if git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ci-repo 2>/tmp/clone.err; then
            mkdir -p /tmp/ci-repo/.ci
            cp /tmp/ci-body /tmp/ci-repo/.ci/last-failure.md || true
            if (cd /tmp/ci-repo \
                && git add .ci/last-failure.md \
                && git -c user.name="github-actions[bot]" \
                      -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                      commit -q -m "ci: record the last ISO failure [skip ci]" \
                && git push -q origin HEAD:main); then
              echo "failure log committed to .ci/last-failure.md"
            else
              echo "clone ok but commit/push failed"
            fi
          else
            echo "clone failed: $(head -c 300 /tmp/clone.err 2>/dev/null)"
          fi
          exit "${rc}"

      - name: Prove the pre-seeded partition layout is inside the ISO
        # The five-partition layout only reaches the installed system via interactive-defaults.ks
        # inside the install environment. Installer ISOs carry that environment in different
        # images depending on lorax flavour (LiveOS/squashfs.img vs images/install.img, squashfs
        # or ext4), so probe instead of assuming. Diagnostics are committed to .ci/iso-verify.md
        # because run logs are not readable without a token - the repo is the reliable channel.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ISO="$(find . -maxdepth 1 -name '*.iso' -print -quit)"
          DIAG=/tmp/iso-verify.md
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_REF="ghcr.io/${OWNER}/${IMAGE:-z13-fedora}:${TAG:-latest}"
          rc_img=0
          {
            echo "## Baked content in the published image"
            echo "- image: \`$IMAGE_REF\`"
            echo '```'
            docker run --rm --entrypoint bash "$IMAGE_REF" -c '
              echo "### /var/lib/flatpak/app"
              ls /var/lib/flatpak/app 2>&1
              echo "### sizes"
              du -sh /var/lib/flatpak /usr/share/waydroid-extra/images 2>&1
              echo "### waydroid images"
              ls -lh /usr/share/waydroid-extra/images 2>&1
              echo "### packages"
              rpm -q fprintd waydroid btop 2>&1
            ' 2>&1 || rc_img=$?
            echo '```'
            echo "- content check exit: $rc_img"
            echo
          } > /tmp/image-content.md
          {
            echo "# ISO verification"
            echo
            echo "- iso: \`$ISO\`"
            echo "- date: $(date -u +%FT%TZ)"
            echo
            if [ -f /tmp/image-content.md ]; then cat /tmp/image-content.md; echo; fi
            echo '## ISO root listing follows'
          } > "$DIAG"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools
          rm -rf /tmp/iso-verify && mkdir -p /tmp/iso-verify
          {
            echo '## ISO root listing'
            echo '```'
            xorriso -indev "$ISO" -lsl / 2>&1
            echo '```'
          } >> "$DIAG"
          rc=1
          KS=/tmp/iso-verify/interactive-defaults.ks
          for cand in LiveOS/squashfs.img images/install.img; do
            if xorriso -osirrox on -indev "$ISO" -extract "/$cand" "/tmp/iso-verify/env.img" 2>/dev/null; then
              kind=$(file -b /tmp/iso-verify/env.img)
              echo "- env image: /$cand ($kind)" >> "$DIAG"
              case "$kind" in
                *Squashfs*)
                  if unsquashfs -q -f -d /tmp/iso-verify/root /tmp/iso-verify/env.img \
                       usr/share/anaconda/interactive-defaults.ks >/dev/null 2>&1; then
                    cp /tmp/iso-verify/root/usr/share/anaconda/interactive-defaults.ks "$KS" && rc=0
                  fi
                  ;;
                *ext[234]*)
                  if debugfs -R "dump /usr/share/anaconda/interactive-defaults.ks $KS" \
                       /tmp/iso-verify/env.img >/dev/null 2>&1 && [ -s "$KS" ]; then
                    rc=0
                  fi
                  ;;
              esac
              [ "$rc" -eq 0 ] && break
            fi
            rm -f /tmp/iso-verify/env.img
          done
          if [ "$rc" -eq 0 ]; then
            {
              echo '## interactive-defaults.ks (key lines)'
              echo '```'
              grep -nE "z13-layout|clearpart|zerombr|^part |ostreecontainer" "$KS" 2>&1
              echo '```'
            } >> "$DIAG"
            if grep -q "z13-layout" "$KS"; then
              echo '- verdict: **PASS** - pre-seeded layout is inside the ISO' >> "$DIAG"
            else
              echo '- verdict: **FAIL** - file extracted but the z13-layout marker is missing' >> "$DIAG"
              rc=2
            fi
          else
            echo '- verdict: **FAIL** - could not extract interactive-defaults.ks from any known env image' >> "$DIAG"
          fi
          cat "$DIAG"
          if git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ci-repo 2>/tmp/clone.err; then
            mkdir -p /tmp/ci-repo/.ci
            cp "$DIAG" /tmp/ci-repo/.ci/iso-verify.md || true
            if (cd /tmp/ci-repo \
                && git add .ci/iso-verify.md \
                && git -c user.name="github-actions[bot]" \
                      -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                      commit -q -m "ci: ISO layout verification [skip ci]" \
                && git push -q origin HEAD:main); then
              echo "diagnostics committed to .ci/iso-verify.md"
            else
              echo "diag commit/push failed (non-fatal)"
            fi
          else
            echo "diag clone failed (non-fatal): $(head -c 200 /tmp/clone.err 2>/dev/null)"
          fi
          if [ "$rc" -ne 0 ] || [ "$rc_img" -ne 0 ]; then
            exit 1
          fi
          exit 0

      - name: Upload the builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-builder-log
          path: /tmp/iso.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: z13-fedora-iso
          path: |
            *.iso
            *.iso-CHECKSUM
          if-no-files-found: error
          retention-days: 7 # artifacts are free for public repos, but keep the storage sane

      - name: Attach the checksum to the release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          # GitHub caps release assets at 2 GiB and this ISO is ~6 GiB, so the ISO itself cannot be
          # a release asset: the workflow artifact is the distribution channel, and the release gets
          # the checksum plus a pointer to the run.
          files: |
            *.iso-CHECKSUM
          body: |
            Installer ISO built from `${{ github.event.workflow_run.head_sha }}`.

            Download it from this workflow run's **Artifacts** section (the file is ~6 GiB, above
            GitHub's 2 GiB per-release-asset limit, so it is not attached here). Verify with the
            accompanying `.iso-CHECKSUM`, then write it to a >=16 GB USB stick with Fedora Media
            Writer or `dd` — not a plain file copy (FAT32 cannot hold it).
